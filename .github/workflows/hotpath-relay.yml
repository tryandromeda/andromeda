name: Benchmark relay

on:
  workflow_run:
    workflows: ["Benchmark"] # must match the benchmark workflow name
    types: [completed]

jobs:
  relay:
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@f98dee237c49087e20b94b62bcd9becfceeee357 # v0.29.2
    permissions:
      actions: read # download the artifact of the benchmark run
      id-token: write # authenticate the upload
      pull-requests: read # find the pull request the run belongs to
    with:
      benchmark: performance
      artifact_name: hotpath-report
      report_file: report.json
